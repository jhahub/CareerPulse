services:
  careerpulse:
    build: .
    expose:
      - "8085"
    labels:
      - "traefik.http.middlewares.careerpulse-basic-auth.basicauth.users=${CAREERPULSE_BASIC_AUTH:?}"
      - "traefik.http.middlewares.careerpulse-basic-auth.basicauth.removeheader=true"
      - "coolify.traefik.middlewares=careerpulse-basic-auth"  
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/api/health"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: unless-stopped
