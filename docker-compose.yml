services:
  careerpulse:
    build: .
    expose:
      - "8085"
    labels:
      - "traefik.http.middlewares.careerpulse-basic-auth.basicauth.users=${CAREERPULSE_TRAEFIK_AUTH:?}"
      - "traefik.http.middlewares.careerpulse-basic-auth.basicauth.removeheader=true"
      - "coolify.traefik.middlewares=careerpulse-basic-auth"  
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: 
      - "CMD"
      - "python"
      - "-c"
      - "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8085/api/health', timeout=5); raise SystemExit(0 if response.status == 200 else 1)"
      interval: 60s
      timeout: 5s
      retries: 3
    restart: unless-stopped
